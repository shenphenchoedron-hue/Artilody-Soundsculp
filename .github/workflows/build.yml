name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the release job may write.
permissions:
  contents: read

env:
  APP_NAME: "Artilody Soundsculp"
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  # ---------------------------------------------------------------------------
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            container: ""
            label: ubuntu-22.04-24.04
          - name: debian
            container: debian:12
            label: debian-12
    container: ${{ matrix.container }}
    steps:
      - name: Install dependencies (Debian container)
        if: matrix.container != ''
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git cmake g++ make pkg-config file dpkg-dev \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev xvfb xauth ca-certificates xz-utils
      - name: Install dependencies (Ubuntu)
        if: matrix.container == ''
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake g++ pkg-config dpkg-dev file xz-utils \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev xvfb
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j4
      - name: Self test
        run: |
          xvfb-run -a "build/ArtilodySoundsculp_artefacts/Release/Artilody Soundsculp" --selftest
          xvfb-run -a "build/ArtilodySoundsculp_artefacts/Release/Artilody Soundsculp" --uitest
      - name: Package (.deb)
        run: |
          set -eu
          cd build
          cpack -G DEB
          DEB=$(ls artilody-soundsculp_*_amd64.deb)
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB" > contents.txt
          for f in \
            ./usr/bin/artilody-soundsculp \
            ./usr/lib/artilody-soundsculp/artilody-soundsculp \
            ./usr/share/doc/artilody-soundsculp/copyright \
            ./usr/share/doc/artilody-soundsculp/LICENSE \
            ./usr/share/doc/artilody-soundsculp/THIRD_PARTY_NOTICES.md \
            ./usr/share/doc/artilody-soundsculp/licenses/AGPL-3.0.txt \
            ./usr/share/doc/artilody-soundsculp/licenses/JUCE-LICENSE.md \
            ./usr/share/doc/artilody-soundsculp/Artilody-Soundsculp-Manual-EN.pdf \
            ./usr/share/doc/artilody-soundsculp/Artilody-Soundsculp-Manual-DA.pdf; do
            grep -qF " $f" contents.txt || { echo "missing in .deb: $f"; exit 1; }
          done
          mkdir -p ../dist
          VERSION=$(grep -m1 "project(ArtilodySoundsculp VERSION" ../CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          mv "$DEB" "../dist/artilody-soundsculp_${VERSION}_${{ matrix.label }}_amd64.deb"
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.name }}
          path: dist/*.deb

  # ---------------------------------------------------------------------------
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Check static VC++ runtime
        shell: pwsh
        run: |
          $exe = "build\ArtilodySoundsculp_artefacts\Release\Artilody Soundsculp.exe"
          foreach ($dll in 'VCRUNTIME140.dll', 'MSVCP140.dll', 'VCRUNTIME140_1.dll') {
            if (Select-String -Path $exe -Pattern $dll -SimpleMatch -Quiet) { throw "$exe depends on $dll (VC++ runtime must be linked statically)" }
          }
      - name: Stage files
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force -Path $stage, "$stage\docs", "$stage\licenses", dist | Out-Null
          Copy-Item "build\ArtilodySoundsculp_artefacts\Release\Artilody Soundsculp.exe" $stage
          foreach ($pdf in 'Artilody-Soundsculp-Manual-DA.pdf', 'Artilody-Soundsculp-Manual-EN.pdf') {
            if (-not (Test-Path "docs\pdf\$pdf")) { throw "Missing manual docs\pdf\$pdf" }
            Copy-Item "docs\pdf\$pdf" "$stage\docs"
          }
          Copy-Item LICENSE "$stage\LICENSE.txt"
          Copy-Item THIRD_PARTY_NOTICES.md "$stage\THIRD_PARTY_NOTICES.txt"
          Copy-Item -Recurse packaging\licenses\* "$stage\licenses"
      - name: Verify staging
        shell: pwsh
        run: |
          $required = 'Artilody Soundsculp.exe', 'LICENSE.txt', 'THIRD_PARTY_NOTICES.txt',
                      'docs\Artilody-Soundsculp-Manual-DA.pdf', 'docs\Artilody-Soundsculp-Manual-EN.pdf',
                      'licenses\AGPL-3.0.txt', 'licenses\JUCE-LICENSE.md'
          foreach ($f in $required) { if (-not (Test-Path "stage\$f")) { throw "Missing in staging: $f" } }
          Get-ChildItem -Recurse stage | Select-Object FullName, Length
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(ArtilodySoundsculp VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if (-not $version) { throw "Could not read project version from CMakeLists.txt" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\stage" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Compress-Archive -Path stage\* -DestinationPath "dist\ArtilodySoundsculp-$version-Windows-Portable.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  # ---------------------------------------------------------------------------
  macos:
    name: macOS (Universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET"
      - name: Build
        run: cmake --build build --config Release --parallel -- -quiet
      - name: Self test
        run: |
          "build/ArtilodySoundsculp_artefacts/Release/Artilody Soundsculp.app/Contents/MacOS/Artilody Soundsculp" --selftest
      - name: Add licenses to the app bundle
        run: |
          set -eu
          APP="build/ArtilodySoundsculp_artefacts/Release/Artilody Soundsculp.app"
          RES="$APP/Contents/Resources"
          mkdir -p "$RES/licenses"
          cp LICENSE "$RES/LICENSE.txt"
          cp THIRD_PARTY_NOTICES.md "$RES/THIRD_PARTY_NOTICES.md"
          cp -R packaging/licenses/. "$RES/licenses/"
      - name: Sign (ad-hoc) and create DMG
        run: |
          set -eu
          VERSION=$(grep -m1 "project(ArtilodySoundsculp VERSION" CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          APP="build/ArtilodySoundsculp_artefacts/Release/Artilody Soundsculp.app"
          for f in "$APP/Contents/Resources/LICENSE.txt" \
                   "$APP/Contents/Resources/THIRD_PARTY_NOTICES.md" \
                   "$APP/Contents/Resources/licenses/AGPL-3.0.txt" \
                   "$APP/Contents/Resources/licenses/JUCE-LICENSE.md" \
                   docs/pdf/Artilody-Soundsculp-Manual-EN.pdf docs/pdf/Artilody-Soundsculp-Manual-DA.pdf; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          codesign --force --deep --sign - "$APP"
          mkdir -p dmg dist
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          mkdir -p dmg/Manuals dmg/Licenses
          cp docs/pdf/*.pdf dmg/Manuals/
          cp LICENSE dmg/Licenses/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md dmg/Licenses/
          cp -R "$APP/Contents/Resources/licenses/." dmg/Licenses/
          hdiutil create -volname "Artilody Soundsculp" -srcfolder dmg -ov -format UDZO "dist/ArtilodySoundsculp-${VERSION}-macOS-Universal.dmg"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ linux, windows, macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check tag matches project version
        run: |
          VERSION=$(grep -m1 "project(ArtilodySoundsculp VERSION" CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CMake project version $VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          set -eu
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cp docs/pdf/Artilody-Soundsculp-Manual-EN.pdf docs/pdf/Artilody-Soundsculp-Manual-DA.pdf release/
          ls -la release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Artilody Soundsculp ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: release/*
